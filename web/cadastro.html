<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de aliens</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Cabeçalho de navegação -->
    <header class="topo">
        <h1>Cadastro de aliens de ben 10</h1>
        <li class="home"><a href="index.html">Home</a></li>
        <li class="crud"><a href="cadastro.html">Cadastro</a></li>
    </header>

    <!-- Conteúdo principal -->
    <main class="principal">
        <section class="conteudo">

            <div class="artigo">
                <h2>Cadastrar Novo Alien</h2>
                <p>Preencha os campos para cadastrar o alienígena.</p>
            </div>

            <!-- Formulário de cadastro -->
            <form id="form-cad">
                <label for="nome-alien">Nome:</label>
                <input type="text" id="nome-alien" placeholder="Nome do alien" required>

                <label for="series-alien">Séries:</label>
                <select id="series-alien" multiple required> <!-- Multiplas escolhas -->
                    <option value="CLASSICO">Clássico</option>
                    <option value="FORCA_ALIENIGENA">Força Alienígena</option>
                    <option value="SUPREMACIA_ALIENIGENA">Supremacia Alienígena</option>
                    <option value="HEROIS_UNIDOS">Heróis Unidos</option>
                    <option value="OMNIVERSE">Omniverse</option>
                </select>

                <button type="button" onclick="cadastrarAlien()">Cadastrar Alien</button>
            </form>

            <!-- Cards dos aliens cadastrados -->
            <div class="lista">
                <h2>Aliens Cadastrados</h2>
                <div id="lista-aliens" class="cards">
                    <!-- Os cards dos aliens serão inseridos aqui -->
                </div>
            </div>

            <!-- Detalhes e edição -->
            <div id="detalhes">
                <h2>Editar / Excluir Alien</h2>

                <label for="nome-edit">Nome:</label>
                <input type="text" id="nome-edit">

                <label for="series-edit">Séries:</label>
                <select id="series-edit" multiple>
                    <option value="CLASSICO">Clássico</option>
                    <option value="FORCA_ALIENIGENA">Força Alienígena</option>
                    <option value="SUPREMACIA_ALIENIGENA">Supremacia Alienígena</option>
                    <option value="HEROIS_UNIDOS">Heróis Unidos</option>
                    <option value="OMNIVERSE">Omniverse</option>
                </select>

                <button type="button" onclick="atualizarAlien()">Atualizar</button>
                <button type="button" onclick="excluirAlien()">Excluir</button>
            </div>

        </section>
    </main>

    <!-- Rodapé do site -->
    <div class="rodape">
        <footer>
            <p>&copy; 2026 FullStack Ben10; Todos os direitos reservados.</p>
        </footer>
    </div>

</body>

</html>
